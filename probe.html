<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Prueba de conexión · Camiones de basura GDL</title>
<meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="font-family:monospace;padding:16px">
<h1>Prueba de conexión</h1><pre id="out"></pre>
<script>
const URL_WS = "wss://workspace.guadalajara.gob.mx/socket/app/6cnmouj20xedzawxb98f?protocol=7&client=js&version=8.4.0&flash=false";
const out = document.getElementById("out");
const st = { origin: location.origin, estado: "conectando", subs: 0, msgs: 0, porEvento: {}, canales: {}, error: null, cierre: null };
window.PROBE = st;
const show = () => out.textContent = JSON.stringify(st, null, 2);
const ws = new WebSocket(URL_WS);
ws.onopen = () => { st.estado = "abierto"; show(); };
ws.onerror = e => { st.error = "onerror (ver consola)"; console.error("[probe] error", e); show(); };
ws.onclose = e => { st.estado = "cerrado"; st.cierre = { code: e.code, reason: e.reason, wasClean: e.wasClean }; console.log("[probe] close", e.code, e.reason); show(); };
ws.onmessage = ev => {
  const m = JSON.parse(ev.data);
  if (m.event === "pusher:connection_established") {
    st.estado = "establecido"; st.conn = JSON.parse(m.data);
    for (let i = 1; i <= 20; i++) ws.send(JSON.stringify({ event: "pusher:subscribe", data: { channel: "geocerca." + i } }));
  } else if (m.event === "pusher:ping") ws.send('{"event":"pusher:pong","data":{}}');
  else if (m.event === "pusher_internal:subscription_succeeded") st.subs++;
  else if (m.event === "pusher:error") { st.error = m.data; console.error("[probe] pusher:error", m.data); }
  else { st.msgs++; st.porEvento[m.event] = (st.porEvento[m.event] || 0) + 1; if (m.channel) st.canales[m.channel] = (st.canales[m.channel] || 0) + 1; if (st.msgs === 1) st.ejemplo = m; }
  show();
};
setInterval(() => ws.readyState === 1 && ws.send('{"event":"pusher:ping","data":{}}'), 60000);
show();
setInterval(() => console.log("[probe] " + JSON.stringify({o: st.origin, e: st.estado, subs: st.subs, msgs: st.msgs, ev: st.porEvento, canales: Object.keys(st.canales).length, err: st.error, cierre: st.cierre})), 10000);
</script></body></html>
